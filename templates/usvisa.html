<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visa Approval Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-dark px-3 py-3">
      <div class="container-fluid">
        <span class="navbar-brand fw-bold">Visa Approval Prediction</span>
      </div>
    </nav>
    <section class="py-4">
      <div class="container">
        <div class="glass-panel p-4 p-md-5">
          <form action="/" method="post" class="row g-3">
            <div class="col-12"><h1 class="h3 mb-0">Predict US visa approval</h1></div>

            <div class="col-md-6">
              <label class="form-label" for="continent">Continent</label>
              <select class="form-control" id="continent" name="continent" required>
                <option value="" disabled selected>Select Continent</option>
                <option>Asia</option><option>Africa</option><option>North America</option><option>Europe</option><option>South America</option><option>Oceania</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="education_of_employee">Education</label>
              <select class="form-control" id="education_of_employee" name="education_of_employee" required>
                <option value="" disabled selected>Select Education</option>
                <option>High School</option><option>Bachelor's</option><option>Master's</option><option>Doctorate</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="has_job_experience">Has Job Experience</label>
              <select class="form-control" id="has_job_experience" name="has_job_experience" required>
                <option value="" disabled selected>Select</option><option>Y</option><option>N</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="requires_job_training">Requires Job Training</label>
              <select class="form-control" id="requires_job_training" name="requires_job_training" required>
                <option value="" disabled selected>Select</option><option>Y</option><option>N</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="no_of_employees">Number of Employees</label>
              <input class="form-control" id="no_of_employees" name="no_of_employees" type="number" min="1" required>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="region_of_employment">Region</label>
              <select class="form-control" id="region_of_employment" name="region_of_employment" required>
                <option value="" disabled selected>Select Region</option>
                <option>West</option><option>Northeast</option><option>South</option><option>Midwest</option><option>Island</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="prevailing_wage">Prevailing Wage</label>
              <input class="form-control" id="prevailing_wage" name="prevailing_wage" type="number" min="0" required>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="unit_of_wage">Unit of Wage</label>
              <select class="form-control" id="unit_of_wage" name="unit_of_wage" required>
                <option value="" disabled selected>Select Unit</option>
                <option>Hour</option><option>Year</option><option>Week</option><option>Month</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="full_time_position">Full Time Position</label>
              <select class="form-control" id="full_time_position" name="full_time_position" required>
                <option value="" disabled selected>Select</option><option>Y</option><option>N</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="company_age">Company Age</label>
              <input class="form-control" id="company_age" name="company_age" type="number" min="0" required>
            </div>
            <div class="col-12 d-grid pt-2">
              <button class="btn btn-primary btn-lg" type="submit">Predict Visa Status</button>
            </div>
          </form>
          <div class="text-center mt-4">
            <h2 class="h4 mb-0">Visa Prediction Status: {{ context }}</h2>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
